[package]
name = "whiteboard"
version = "0.1.0"
description = "AI-native whiteboard and 3D viewer"
edition = "2021"

[lib]
name = "whiteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.6"
serde_json = "1"
